apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-converter
          image: jerevla/temperature-converter:latest
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: temperature-converter-service
spec:
  type: NodePort
  selector:
    app: temperature-converter
  ports:
    - port: 8080
      targetPort: 8080